{% extends "base.html" %}

{% block content %}
<div class="w-full max-w-md bg-white p-8 rounded-2xl shadow-lg border border-emerald-100 space-y-6 mx-auto mt-10">
    <div class="text-center">
        <h2 class="text-2xl font-bold text-gray-800">Nueva Contraseña</h2>
        <p class="text-sm text-gray-500 mt-1">Ingresa tu nueva contraseña para acceder a EcoWatt.</p>
    </div>

    <form id="formReset" class="space-y-4">
        <input type="hidden" id="token" value="{{ token }}">
        
        <div>
            <label class="block text-sm font-medium text-gray-700">Nueva Contraseña</label>
            <input type="password" id="password" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none">
        </div>

        <button type="submit" class="w-full py-3 bg-emerald-600 text-white rounded-xl hover:bg-emerald-700 transition font-medium">
            Guardar Nueva Contraseña
        </button>
    </form>

    <div id="mensaje" class="hidden text-sm p-3 rounded-lg text-center"></div>
</div>

<script>
document.getElementById('formReset').addEventListener('submit', async (e) => {
    e.preventDefault();
    const token = document.getElementById('token').value;
    const password = document.getElementById('password').value;
    const mensajeDiv = document.getElementById('mensaje');

    const res = await fetch('/api/auth/restablecer', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, password })
    });

    const data = await res.json();
    mensajeDiv.classList.remove('hidden', 'bg-red-100', 'text-red-700', 'bg-green-100', 'text-green-700');

    if (res.ok) {
        mensajeDiv.classList.add('bg-green-100', 'text-green-700');
        mensajeDiv.textContent = data.message + ' Redirigiendo al inicio de sesión...';
        setTimeout(() => window.location.href = '/login', 2000);
    } else {
        mensajeDiv.classList.add('bg-red-100', 'text-red-700');
        mensajeDiv.textContent = data.error;
    }
});
</script>
{% endblock %}
