{% extends "base.html" %}

{% block title %}Recuperar Acceso - EcoWatt{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white p-8 rounded-xl shadow-sm border border-gray-100 my-12">
    <h2 class="text-2xl font-bold text-gray-800 text-center mb-2">Recuperar Cuenta</h2>
    <p class="text-xs text-gray-500 text-center mb-6">Ingresa tu correo registrado y te enviaremos las instrucciones de acceso.</p>

    <div id="alerta-recuperar" class="hidden mb-4 p-3 rounded-lg text-sm"></div>

    <form id="form-recuperar" class="space-y-4">
        <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">Correo Electrónico Registrado</label>
            <input type="email" id="email" required placeholder="correo@ejemplo.com"
                   class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg focus:ring-emerald-500 focus:border-emerald-500">
        </div>

        <button type="submit" class="w-full bg-emerald-600 text-white font-medium py-2 rounded-lg hover:bg-emerald-700 transition">
            Enviar Enlace de Recuperación
        </button>
    </form>

    <div class="mt-6 border-t border-gray-100 pt-4 text-center">
        <a href="/login" class="text-xs text-emerald-600 font-semibold hover:underline">← Volver al inicio de sesión</a>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    document.getElementById('form-recuperar').addEventListener('submit', async (e) => {
        e.preventDefault();
        const alerta = document.getElementById('alerta-recuperar');
        const email = document.getElementById('email').value.trim();

        try {
            const res = await fetch('/api/auth/recuperar', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email })
            });

            const data = await res.json();

            if (res.ok) {
                alerta.className = "mb-4 p-3 rounded-lg text-sm bg-emerald-100 text-emerald-800";
                alerta.innerText = data.message;
                alerta.classList.remove('hidden');
            } else {
                throw new Error(data.error || 'Error al enviar la solicitud');
            }
        } catch (err) {
            alerta.className = "mb-4 p-3 rounded-lg text-sm bg-red-100 text-red-800";
            alerta.innerText = err.message;
            alerta.classList.remove('hidden');
        }
    });
</script>
{% endblock %}
